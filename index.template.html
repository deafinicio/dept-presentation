<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f6f8">
<meta name="description" content="Ігрові сесії про мінну небезпеку для дошкільнят. Презентація Відділу протимінної діяльності Харківської обласної організації ТЧХУ для працівників дитсадків.">
<title>Як ми говоримо з дошкільнятами про мінну небезпеку</title>
<style>
/* EMBEDDED_FONTS */
:root { color-scheme:light; --ink:#191e2a; --muted:#495364; --accent:#ac2134; --red-wash:#fae9ec; --bg:#f4f5f8; --edge:#dce0e8; --white:#fff; --navy:#202b3c; --navy-deep:#151d2a; }
*, *::before, *::after { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:500 16px/1.55 Montserrat,system-ui,sans-serif; }
button, input, textarea { font:inherit; }
button { cursor:pointer; }
a { color:inherit; }
button:focus-visible, a:focus-visible, [tabindex="0"]:focus-visible { outline:3px solid #325f92; outline-offset:4px; }
button:disabled { cursor:default; }
button, .button-link { -webkit-tap-highlight-color:transparent; }
.sr { position:absolute; clip-path:inset(50%); width:1px; height:1px; overflow:hidden; white-space:nowrap; }
[hidden] { display:none!important; }
.shell { max-width:1550px; padding:0 clamp(15px,3.4vw,60px) 18px; margin-inline:auto; }
.top { min-height:76px; display:flex; gap:18px; align-items:center; justify-content:space-between; border-bottom:1px solid var(--edge); }
.identity { display:flex; align-items:center; gap:12px; text-decoration:none; }
.identity-mark { background:var(--accent); width:9px; height:31px; flex:0 0 auto; border-radius:2px; }
.identity strong, .identity small { display:block; line-height:1.4; }
.identity strong { font-size:.84rem; font-weight:780; }
.identity small { font-size:.73rem; color:var(--muted); margin-top:2px; }
.button, .button-link { display:inline-flex; min-height:42px; gap:9px; align-items:center; justify-content:center; border:1px solid var(--edge); padding:9px 13px; border-radius:7px; background:var(--white); color:var(--ink); text-decoration:none; font-size:.8rem; font-weight:760; text-align:center; }
.button:not(:disabled):hover, .button-link:hover { background:#e9edf4; }
.primary { background:var(--accent); border-color:var(--accent); color:white; }
.button.primary:not(:disabled):hover { background:#89172a; }
.button:disabled { opacity:.42; }
.top-tools { display:flex; gap:8px; align-items:center; }
.top-tools svg, .button svg { flex:0 0 16px; }
.stage-region { margin-top:15px; }
.slide { min-height:clamp(565px,calc(100svh - 182px),780px); overflow:hidden; border:1px solid var(--edge); border-radius:16px; background:var(--white); animation:enter-slide 210ms ease-out both; }
.slide-split { display:grid; grid-template-columns:minmax(0,.94fr) minmax(0,1.06fr); }
.slide-copy, .section-wrap { padding:clamp(25px,4vw,64px); }
.slide-copy { display:flex; flex-direction:column; justify-content:center; align-items:flex-start; }
.eyebrow { margin:0 0 16px; letter-spacing:.085em; text-transform:uppercase; font-size:.74rem; font-weight:820; color:var(--accent); }
h1, h2, h3, p, figure, ul, ol { margin-top:0; }
h1 { margin-bottom:18px; font-size:clamp(2rem,4.3vw,4.55rem); font-weight:825; letter-spacing:-.052em; line-height:1.07; text-wrap:balance; }
.section-wrap > h1, .slide:not(.cover) h1 { font-size:clamp(2rem,3.6vw,3.8rem); }
h1:focus { outline:none; }
.cover h1 { font-size:clamp(2.25rem,3.65vw,4.15rem); }
.cover h1 span { color:var(--accent); }
.lead { max-width:63ch; margin:0 0 21px; color:var(--muted); font-size:clamp(.98rem,1.45vw,1.19rem); }
.cover .lead { margin-bottom:25px; }
.slide-cta { margin-top:2px; }
/* Two views of one story: the text and the persistent 3D ribbon. */
.presentation-grid { display:grid; grid-template-columns:minmax(350px,.85fr) minmax(0,1.35fr); min-width:0; }
.stage-region { background:var(--white); border:1px solid var(--edge); border-radius:16px; overflow:hidden; }
#stage { min-width:0; }
#stage .slide { border:0; border-radius:0; display:flex; flex-direction:column; height:100%; justify-content:center; }
#stage .slide-copy, #stage .section-wrap { padding:clamp(22px,3vw,47px); }
#stage .cover h1 { font-size:clamp(2.1rem,3.52vw,3.85rem); }
#stage .slide:not(.cover) h1 { font-size:clamp(1.85rem,2.9vw,3.12rem); }
#stage .lead { font-size:clamp(.96rem,1.18vw,1.08rem); }
.gallery-space { position:relative; min-width:0; min-height:430px; isolation:isolate; overflow:hidden; color:#f5f8fd; background:radial-gradient(ellipse at 36% 54%,#617a9b 0%,#344863 48%,#1d2a3f 88%); }
.gallery-space::before { content:""; position:absolute; inset:0; pointer-events:none; opacity:.48; background:linear-gradient(90deg,#ffffff0c 1px,transparent 1px),linear-gradient(0deg,#ffffff0c 1px,transparent 1px); background-size:32px 32px; mask-image:linear-gradient(180deg,#0009,#000 59%,#0002); }
.gallery-canvas { position:absolute; inset:0; display:block; width:100%; height:100%; z-index:1; }
.space-header, .space-controls { position:absolute; z-index:2; display:flex; gap:8px; align-items:center; left:16px; right:16px; }
.space-header { top:16px; justify-content:space-between; }
.space-controls { bottom:15px; justify-content:space-between; align-items:flex-end; }
.space-badge { border:1px solid #859aba75; border-radius:6px; background:#17243bd9; color:#edf3ff; font-size:.71rem; font-weight:750; padding:6px 9px; }
.space-button { border:1px solid #b7c8e5a0; border-radius:7px; background:#edf4fff2; color:#223550; font-weight:760; font-size:.73rem; min-height:37px; padding:6px 9px; text-align:left; }
.space-button:hover { background:white; }
.space-photos { display:flex; align-items:flex-end; flex-wrap:wrap; gap:5px; }
#overview { flex-shrink:0; }
.space-fallback { position:absolute; inset:0; display:grid; place-items:center; color:var(--ink); }
.gallery-ready .space-fallback { visibility:hidden; }
.space-fallback div { width:min(65%,470px); padding:50px 12px; text-align:center; border:1px solid #ccdbef; border-top:4px solid var(--accent); border-radius:7px; background:#f1f5fc; box-shadow:5px 7px 0 #8197b6,13px 20px 32px #101c31a0; transform:perspective(720px) rotateY(-14deg); }
.space-fallback strong { font-size:clamp(1.2rem,2vw,2.1rem); }
.cards { display:grid; grid-template-columns:1fr; gap:8px; margin:16px 0 0; }
.card { border:1px solid var(--edge); border-radius:10px; padding:11px 14px; background:#f9fafc; }
.card h2 { margin:0 0 7px; font-size:clamp(.96rem,1.23vw,1.16rem); line-height:1.26; letter-spacing:-.018em; font-weight:800; }
.card p { margin:0; color:var(--muted); font-size:.85rem; }
.org-line { max-width:43ch; font-weight:700; color:#334055; border-left:3px solid var(--accent); padding-left:13px; margin-bottom:24px; }
.dept-head { max-width:1000px; }
.dept-head h1 { max-width:16ch; }
.sequence { padding-left:0; display:grid; margin:0; list-style:none; gap:0; width:100%; }
.sequence li { display:grid; grid-template-columns:30px 1fr; gap:11px; padding:11px 0; border-top:1px solid var(--edge); }
.sequence .count { font-size:.75rem; align-self:start; color:var(--accent); font-weight:850; padding-top:2px; }
.sequence strong { display:block; margin-bottom:2px; line-height:1.25; }
.sequence p { font-size:.88rem; color:var(--muted); margin:0; }
.game-list { display:flex; flex-wrap:wrap; gap:7px; margin:0 0 13px; }
.game-step { min-height:37px; border:1px solid var(--edge); border-radius:6px; background:white; color:var(--ink); font-size:.75rem; font-weight:760; padding:7px 9px; }
.game-step:hover { border-color:#aab8cd; }
.game-step[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); background:var(--red-wash); }
.prompt { width:100%; background:#f1f4f9; border:1px solid #dce3ed; padding:15px 17px; border-radius:9px; min-height:125px; }
.prompt small { display:block; margin-bottom:4px; color:var(--accent); font-size:.67rem; font-weight:850; text-transform:uppercase; letter-spacing:.05em; }
.prompt h2 { font-size:clamp(1.03rem,1.6vw,1.33rem); line-height:1.25; margin:0 0 8px; }
.prompt p { font-size:.83rem; color:var(--muted); margin:0; }
.media-set { display:grid; grid-template-columns:1fr 1.15fr; gap:12px; margin-top:15px; }
.formats { display:flex; flex-wrap:wrap; gap:9px; border-top:1px solid var(--edge); margin-top:15px; padding-top:11px; }
.formats div { flex:1 1 280px; max-width:58ch; color:var(--muted); font-size:.9rem; }
.formats strong { color:var(--ink); display:block; margin:0 0 4px; }
.final-sheet { border-top:1px solid var(--edge); padding:16px clamp(22px,3vw,47px) 20px; background:#f0f4fa; color:var(--ink); }
.final-sheet h2 { font-size:clamp(1rem,1.43vw,1.35rem); letter-spacing:-.019em; line-height:1.15; margin-bottom:9px; }
.final-sheet p, .final-sheet li { color:#37485f; }
.final-sheet ol { list-style:none; counter-reset:brief; padding:0; margin-bottom:0; }
.final-sheet li { counter-increment:brief; padding:6px 0; border-top:1px solid #cdd9e9; font-size:.82rem; display:flex; align-items:baseline; gap:12px; }
.final-sheet li::before { content:"0" counter(brief); color:var(--accent); font-size:.75rem; font-weight:800; }
.site-contacts:empty { display:none; }
.site-contacts { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 12px; }
.inline-note { color:var(--muted); font-size:.82rem; margin:12px 0 0; }
.copy-output { width:100%; resize:vertical; color:var(--ink); margin-top:9px; padding:9px; font-size:.84rem; }
.control-bar { position:relative; margin-top:10px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:stretch; }
.timeline { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); min-width:0; gap:5px; }
.nav-item { min-width:0; border:1px solid var(--edge); border-radius:7px; background:#fdfeff; color:#354055; display:flex; align-items:center; gap:6px; min-height:42px; padding:5px 8px; text-align:left; font-size:.72rem; font-weight:730; line-height:1.25; }
.nav-item span { color:#657187; font-size:.62rem; font-weight:850; }
.nav-item:hover { background:#eceff6; }
.nav-item[aria-current="step"] { border-color:#bd6270; background:var(--red-wash); color:#8e2031; }
.nav-item[aria-current="step"] span { color:#8e2031; }
.step-controls { display:flex; gap:7px; align-items:stretch; }
.step-controls .button { min-width:41px; padding-inline:8px; }
.footer { justify-content:space-between; display:flex; gap:10px; margin-top:8px; color:var(--muted); font-size:.72rem; font-weight:640; }
.footer-output { color:#27374e; }
dialog { width:min(96vw,1100px); max-height:94vh; padding:11px; background:#1b2432; color:#fff; border:1px solid #d8e1ed; border-radius:12px; box-shadow:0 12px 60px #060c1760; }
dialog::backdrop { background:#101625cc; }
dialog header { display:flex; justify-content:space-between; gap:10px; align-items:center; margin-bottom:8px; }
dialog p { margin:0 7px; font-size:.9rem; }
dialog img { display:block; width:100%; max-height:77vh; object-fit:contain; }
@keyframes enter-slide { from { opacity:.72; transform:translateY(4px); } }
@media (max-width: 1000px) { .timeline .nav-item { font-size:.66rem; } .timeline .nav-item span { display:none; } }
@media (max-width: 760px) {
 .top { min-height:64px; }
 .identity small { font-size:.65rem; }
 .identity strong { font-size:.73rem; }
 .top-tools .button span { display:none; }
 .stage-region { margin-top:11px; }
 .slide { min-height:0; }
 .presentation-grid { grid-template-columns:1fr; }
 .gallery-space { min-height:clamp(315px,73vw,490px); }
 .space-header,.space-controls { left:9px; right:9px; }
 .space-header { top:9px; } .space-controls { bottom:9px; }
 #stage .cover h1, #stage .slide:not(.cover) h1 { font-size:clamp(1.85rem,7.3vw,3.2rem); }
 #stage .slide-copy, #stage .section-wrap { padding:22px 19px; }
 .slide-split { grid-template-columns:1fr; }
 .slide-copy, .section-wrap { padding:22px 19px; }
 h1, .cover h1, .section-wrap > h1, .slide:not(.cover) h1 { font-size:clamp(1.85rem,7.3vw,3.2rem); }
 .control-bar { gap:7px; }
 .timeline { display:flex; overflow-x:auto; padding:3px; margin:-3px; }
 .nav-item { flex:0 0 auto; }
 .footer { font-size:.66rem; }
 .final-sheet { padding:22px 19px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms!important; scroll-behavior:auto!important; } }
</style>
</head>
<body>
<div class="shell">
 <header class="top">
  <a href="#pochatok" class="identity" id="identity" aria-label="На початок презентації">
   <span class="identity-mark" aria-hidden="true"></span>
   <div><strong>Відділ протимінної діяльності</strong><small>Харківська обласна організація ТЧХУ</small></div>
  </a>
  <div class="top-tools">
   <button class="button" type="button" id="full" aria-label="На весь екран">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg>
    <span>На весь екран</span>
   </button>
  </div>
 </header>
 <main class="stage-region presentation-grid">
  <div id="stage"></div>
  <section id="space" class="gallery-space" aria-label="Просторова фотострічка презентації">
   <div class="space-fallback" aria-hidden="true"><div><strong id="space-fallback-title"></strong></div></div>
   <div class="space-header"><span class="space-badge">Фотострічка в 3D</span><span class="space-badge" id="space-label"></span></div>
   <div class="space-controls"><div class="space-photos" id="gallery-photos"></div><button id="overview" class="space-button" type="button" aria-pressed="false">Загальний план</button></div>
  </section>
 </main>
 <nav class="control-bar" aria-label="Навігація презентації">
  <div class="timeline" id="timeline"></div>
  <div class="step-controls">
   <button type="button" class="button" id="prev" aria-label="Попередній слайд">←</button>
   <button type="button" class="button primary" id="next" aria-label="Наступний слайд">→</button>
  </div>
 </nav>
 <footer class="footer">
  <span class="footer-output" id="counter" aria-live="polite"></span>
  <span>Клікер або клавіші ← →</span>
 </footer>
</div>
<dialog id="photo-dialog" aria-labelledby="photo-caption">
 <header><p id="photo-caption"></p><button class="button" id="photo-close" type="button">Закрити</button></header>
 <img id="photo-enlarged" alt="">
</dialog>
<script type="application/json" id="media-config">/* MEDIA_CONFIG */</script>
<script>/* APP_BUNDLE */</script>
</body>
</html>
