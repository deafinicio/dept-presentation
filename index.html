:root{--ink:#1c2034;--muted:#505570;--bg:#eff0fa;--line:#ccd0e2;--hot:#c73135;--coral:#ff5b56;--violet:#9b94ed;color-scheme:light;font:500 16px/1.5 Montserrat,Arial,sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}body{margin:0}button,a{color:inherit;font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #8073de;outline-offset:3px}button{border:0;background:none}button:disabled{opacity:.28;cursor:default}button:hover:enabled{filter:brightness(.92)}[hidden]{display:none!important}
#deck{display:grid;height:100vh;height:100dvh;grid-template-rows:auto minmax(0,1fr) auto 3px;overflow:hidden}header,nav{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:12px clamp(14px,3.6vw,72px);z-index:3;background:#f9f9ff;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:.85rem;text-decoration:none;line-height:1.28;font-size:clamp(.92rem,1.22vw,1.23rem);font-weight:760}.brand small{display:block;font-size:.74em;color:var(--muted);font-weight:550;margin-top:.18em}.brand i{width:32px;height:32px;background:#d42231;clip-path:polygon(33% 0,67% 0,67% 33%,100% 33%,100% 67%,67% 67%,67% 100%,33% 100%,33% 67%,0 67%,0 33%,33% 33%)}
.top-actions,.transport{display:flex;align-items:center;gap:.55rem}.top-actions button,.map-controls button,.photo-link{border:1px solid var(--line);border-radius:30px;padding:.46rem .96rem;font-size:.82rem;font-weight:650;background:#f9f9ff}.top-actions b{font-weight:650}.top-actions #full span{font-size:1rem;margin-right:.3rem}button[aria-pressed=true]{background:var(--ink);color:white}
main{position:relative;isolation:isolate;min-width:0;overflow:hidden;background:radial-gradient(ellipse at 80% 56%,#d4d1fa 0%,#e5e4fa 28%,transparent 63%),#f2f3fc}
main:before{position:absolute;inset:0;content:'';pointer-events:none;background-image:radial-gradient(#7b7e9c55 1px,transparent 1.2px);background-size:20px 20px;mask-image:linear-gradient(90deg,transparent 30%,black 85%)}#space{position:absolute;inset:0}#space canvas{width:100%;height:100%;display:block}#stand{position:absolute;inset:0;display:flex;align-items:center;pointer-events:none;padding:4.5vw 5.6vw}.stand-text{width:46%;pointer-events:auto}.kicker{display:flex;align-items:center;gap:.65rem;font-weight:780;text-transform:uppercase;font-size:clamp(.76rem,1vw,.95rem);letter-spacing:.13em;color:var(--hot)}.kicker:before{content:'';width:28px;height:3px;background:currentColor}
h1,h2,p{margin:0}h1,h2{font-weight:780;letter-spacing:-.06em;line-height:.99;text-wrap:balance}h1{font-size:clamp(3.1rem,6.8vw,7.8rem);margin:.30em 0}.stand-text p{font-size:clamp(1.05rem,1.65vw,1.65rem);line-height:1.5;max-width:29em;color:var(--muted)}#enter{padding:.7rem 1.18rem;background:var(--ink);border-radius:25px;color:white;font-weight:650;margin-top:1.65rem}#enter span{margin-left:1rem;color:#c3befb}
